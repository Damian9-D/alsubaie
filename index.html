<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>شجرة عائلة آل حمود</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --alive:#22c55e; --dead:#ef4444; --navy:#1e293b; --gold:#c5a059;
  --slate50:#f8fafc; --slate100:#f1f5f9; --slate200:#e2e8f0;
  --slate400:#94a3b8; --slate500:#64748b; --slate700:#334155; --slate800:#1e293b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:"Tajawal",sans-serif;background:#f1f5f9;color:#0f172a}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.toolbar{
  position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:100;
  display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.96);
  border:1px solid #e2e8f0;border-bottom:4px solid #cbd5e1;border-radius:999px;
  padding:10px 16px;box-shadow:0 18px 50px rgba(15,23,42,.16);backdrop-filter:blur(14px);
  direction:rtl;white-space:nowrap
}
.switch{display:flex;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:999px;padding:4px}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:800;font-size:14px}
.btn-tab{background:transparent;color:#64748b}
.btn-tab.active{background:#fff;color:#2563eb;box-shadow:0 2px 8px rgba(15,23,42,.08)}
.btn-dark{background:#0f172a;color:#fff}.btn-red{background:#dc2626;color:#fff}
.btn-blue{background:#1d4ed8;color:#fff}.btn-indigo{background:#4f46e5;color:#fff}
.sep{width:1px;height:32px;background:#e2e8f0}
.view{display:none}.view.active{display:block}
.full-wrap{width:100%;margin-top:118px;padding:38px;overflow:auto;direction:ltr}
.print-container{
  position:relative;background:#fff;padding:42px;min-width:max-content;width:max-content;
  border:1px solid #e2e8f0;border-radius:34px;box-shadow:none;
  margin:auto;direction:rtl;overflow:hidden
}
.watermark{
 position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 overflow:hidden;pointer-events:none;opacity:.03;z-index:0
}
.watermark span{font-size:72px;font-weight:900;white-space:nowrap;transform:rotate(-35deg) scale(3)}
.hero{position:relative;z-index:2;text-align:center;margin-bottom:72px}
.hero h1{font-size:30px;line-height:1.15;margin:0 0 18px;font-weight:900;letter-spacing:-2px}
.hero-sub{display:inline-flex;align-items:center;gap:14px;background:#f8fafc;border:1px solid #f1f5f9;border-radius:999px;padding:10px 24px;color:#475569;font-size:17px;font-weight:800}
.dot-blue{width:12px;height:12px;border-radius:50%;background:#2563eb;box-shadow:0 0 0 8px rgba(37,99,235,.08)}
.tree-area{position:relative;z-index:2;display:flex;justify-content:center;padding-bottom:80px;direction:ltr}
.tree-node{display:flex;flex-direction:column;align-items:center;direction:rtl}
.node-card-wrap{position:relative;margin-bottom:58px}
.node-card-wrap.has-children:after{content:"";position:absolute;left:50%;bottom:-58px;width:4px;height:58px;background:#e2e8f0;transform:translateX(-50%);border-radius:99px}
.member-card{width:158px;background:#fff;border:1px solid #f1f5f9;border-bottom:7px solid #e2e8f0;border-radius:24px;overflow:hidden;box-shadow:0 10px 24px rgba(15,23,42,.10)}
.status-bar{height:6px}.alive{background:var(--alive)}.dead{background:var(--dead)}
.member-inner{padding:16px 12px 18px;text-align:center}
.person-icon{width:44px;height:44px;margin:0 auto 10px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:900}
.person-icon.alive-bg{background:#f0fdf4;color:var(--alive)}.person-icon.dead-bg{background:#fef2f2;color:var(--dead)}
.member-name{font-size:14px;font-weight:900;line-height:1.45;min-height:42px;display:flex;align-items:center;justify-content:center}
.small-sep{display:flex;align-items:center;gap:6px;opacity:.1;margin:11px 0}
.small-sep i{height:3px;background:#0f172a;flex:1;border-radius:9px}.small-sep b{width:9px;height:9px;background:#0f172a;border-radius:50%}
.gender-pill{display:inline-flex;align-items:center;gap:5px;background:#f8fafc;border:1px solid #f1f5f9;border-radius:999px;padding:5px 12px;color:#94a3b8;font-size:11px;font-weight:900}
.children-row{position:relative;display:flex;align-items:flex-start;justify-content:center;gap:24px;direction:ltr}
.children-row.multi:before{content:"";position:absolute;top:0;left:calc(100% / (var(--count) * 2));right:calc(100% / (var(--count) * 2));height:4px;background:#e2e8f0;border-radius:99px}
.child-col{position:relative;display:flex;flex-direction:column;align-items:center}.child-col>.down{width:4px;height:32px;background:#e2e8f0;border-radius:99px}
.footer{position:relative;z-index:2;margin-top:30px;padding-top:45px;border-top:4px solid #f8fafc;display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.legend{display:flex;align-items:center;gap:38px;background:#fff;border:1px solid #f1f5f9;border-radius:32px;padding:24px 30px;box-shadow:0 10px 26px rgba(15,23,42,.08)}
.legend-item{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:900;color:#334155}
.legend-dot{width:25px;height:25px;border-radius:50%}.legend-line{width:1px;height:50px;background:#e2e8f0}
.edit-box{background:#f8fafc;border:1px solid #f1f5f9;border-radius:28px;padding:20px 28px;text-align:right;color:#64748b;font-weight:900}
.edit-box small{display:block;color:#cbd5e1;margin-top:7px;letter-spacing:2px}
.branches-view{margin-top:125px;padding:0 20px 70px;display:none;flex-direction:column;align-items:center;gap:55px}
.branches-view.active{display:flex}
.branches-heading{text-align:center}.branches-heading h2{font-size:42px;margin:0 0 10px;font-weight:900;color:#1e293b}.branches-heading p{margin:0;color:#64748b;font-weight:700}
.branch-page{
  width:297mm;height:210mm;background:#fdfcf8;box-shadow:none;font-family:"IBM Plex Sans Arabic",sans-serif;
  position:relative;display:flex;flex-direction:column;padding:24px;border:10px solid var(--navy);
  overflow:hidden;direction:rtl;flex-shrink:0
}
.corner{position:absolute;width:44px;height:44px;z-index:4}
.tl{top:10px;left:10px;border-top:6px solid var(--gold);border-left:6px solid var(--gold)}
.tr{top:10px;right:10px;border-top:6px solid var(--gold);border-right:6px solid var(--gold)}
.bl{bottom:10px;left:10px;border-bottom:6px solid var(--gold);border-left:6px solid var(--gold)}
.br{bottom:10px;right:10px;border-bottom:6px solid var(--gold);border-right:6px solid var(--gold)}
.branch-head{position:relative;z-index:2;text-align:center;margin-bottom:14px}.gold-line{width:78px;height:4px;background:var(--gold);margin:0 auto 8px}
.branch-head .eyebrow{color:var(--gold);font-weight:800;letter-spacing:7px;font-size:11px}.branch-head h3{font-size:30px;margin:4px 0 6px;color:var(--navy);font-weight:900}.branch-head .ancestor{display:flex;justify-content:center;align-items:center;gap:18px;color:#64748b;font-size:11px;font-weight:800}.ancestor i{height:1px;width:48px;background:#e2e8f0}
.branch-content{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:3fr 9fr;gap:18px;min-height:0}
.father-info{border-left:2px solid #f1f5f9;padding-left:16px;display:flex;flex-direction:column;gap:22px}
.father-card{background:var(--navy);color:#fff;padding:14px;border-radius:0 0 25px 0;box-shadow:0 12px 26px rgba(15,23,42,.16)}
.father-card small{opacity:.6;font-weight:800}.father-card h4{font-size:19px;line-height:1.35;margin:5px 0 10px;font-weight:900}
.state-row{display:flex;align-items:center;gap:8px;font-weight:800;opacity:.9}.state-row i{width:10px;height:10px;border-radius:50%}
.stats{flex:1;display:flex;flex-direction:column;justify-content:center;gap:17px}.stat strong{display:block;color:var(--gold);font-size:30px;line-height:1;font-weight:900}.stat span{font-size:7px;color:#94a3b8;font-weight:800}
.stamp{padding:10px;border:1px solid #f1f5f9;border-radius:18px;background:rgba(255,255,255,.55)}.stamp p{font-size:7px;color:#94a3b8;font-weight:800;margin:0 0 10px}.stamp-circle{width:38px;height:38px;border:4px solid rgba(197,160,89,.18);border-radius:50%;display:flex;align-items:center;justify-content:center}.stamp-circle:after{content:"";width:21px;height:21px;border-radius:50%;background:rgba(197,160,89,.09);border:2px solid rgba(197,160,89,.25)}
.desc-grid{display:grid;gap:10px 13px;align-content:start;min-width:0}.desc-card{border-bottom:2px solid #f8fafc;padding-bottom:10px;min-width:0}.desc-title{display:flex;align-items:center;gap:10px;margin-bottom:5px}.desc-title i{width:4px;height:17px}.desc-title strong{font-size:12px;color:var(--navy);font-weight:900}.desc-title small{display:block;color:var(--gold);font-size:6px;font-weight:800}
.gc-grid{display:grid;gap:3px}.gc{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #f1f5f9;padding:3px 5px;border-radius:5px;box-shadow:0 2px 4px rgba(15,23,42,.04);min-width:0}.gc i{width:6px;height:6px;border-radius:50%;flex:0 0 auto}.gc span{font-size:7px;font-weight:800;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{font-size:7px;color:#cbd5e1;font-style:italic}
.branch-foot{position:relative;z-index:2;margin-top:12px;padding:10px 3px 0;border-top:3px solid var(--navy);display:flex;justify-content:space-between;align-items:flex-end}.branch-foot .archive{font-size:7px;color:#94a3b8;font-weight:800;letter-spacing:2px}.branch-foot .doc{font-size:10px;color:var(--navy);font-weight:900}.foot-meta{display:flex;align-items:center;gap:16px}.foot-meta>div{text-align:right}.foot-meta small{display:block;font-size:7px;color:#94a3b8;font-weight:800}.foot-meta strong{font-size:10px;color:var(--navy)}.vline{width:1px;height:23px;background:#e2e8f0}
.export-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.93);color:#fff;align-items:center;justify-content:center;padding:30px}
.export-overlay.show{display:flex}.export-card{width:min(650px,95vw);text-align:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:44px;padding:48px;box-shadow:0 30px 90px rgba(0,0,0,.35)}
.spinner{width:70px;height:70px;border:8px solid rgba(255,255,255,.18);border-top-color:#3b82f6;border-radius:50%;margin:0 auto 22px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:10px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin:18px 0}.progress>div{height:100%;width:0;background:#3b82f6;transition:.3s}
.export-card h2{font-size:34px;margin:0 0 8px}.export-card p{color:#bfdbfe;font-weight:700}.download-link{display:none;margin:22px auto 0;width:max-content;background:#22c55e;color:#fff;text-decoration:none;border-radius:18px;padding:15px 26px;font-size:20px;font-weight:900}
@media(max-width:1000px){
 .toolbar{max-width:96vw;overflow:auto;left:2%;transform:none}
 .full-wrap{padding:18px}.print-container{padding:45px}.hero h1{font-size:54px}
}
@media print{
 @page{size:A4 landscape;margin:0}
 .no-print{display:none!important}
 body{background:#fff!important}
 .full-wrap{margin:0!important;padding:0!important}
 .print-container{box-shadow:none!important;border:0!important;border-radius:0!important;padding:20mm!important}
 .branch-page{box-shadow:none!important;margin:0!important;page-break-after:always!important;width:297mm!important;height:210mm!important;border:10px solid #1e293b!important}
 .view:not(.active),.branches-view:not(.active){display:none!important}
 *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}

.zoom-controls{display:flex;align-items:center;gap:5px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:999px;padding:4px}
.zoom-btn{border:0;background:#fff;color:#1e293b;width:35px;height:35px;border-radius:50%;font-size:20px;font-weight:900;box-shadow:0 1px 4px rgba(15,23,42,.08)}
.zoom-label{min-width:52px;text-align:center;font-size:12px;font-weight:900;color:#475569}
.full-wrap{overscroll-behavior:contain}
.canvas-stage{transform-origin:top center;transition:transform .2s ease}


/* التحريك بالسحب داخل الشجرة الكاملة */
#fullWrap{
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
#fullWrap.is-panning{
  cursor: grabbing;
}
#fullWrap button,
#fullWrap a{
  cursor: pointer;
}


/* نافذة مستقلة للشجرة تسمح بالسحب أفقيًا وعموديًا */
#fullWrap{
  height: calc(100vh - 118px);
  min-height: 520px;
  overflow: auto !important;
  position: relative;
  align-items: flex-start;
  justify-content: flex-start;
  scrollbar-gutter: stable;
}
#canvasStage{
  flex: 0 0 auto;
}


.mobile-only{display:none!important}
body.device-mobile .desktop-full-tree{display:none!important}
body.device-mobile .mobile-only{display:block!important}
body.device-mobile{background:#f8fafc}
body.device-mobile .toolbar{top:8px;left:8px;right:8px;transform:none;width:auto;max-width:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:7px;border-radius:16px;white-space:normal;overflow:visible}
body.device-mobile .toolbar .switch{width:100%;display:grid;grid-template-columns:1fr 1fr}
body.device-mobile .toolbar .switch .btn{width:100%}
body.device-mobile .toolbar .sep,body.device-mobile .toolbar .zoom-controls{display:none!important}
body.device-mobile .toolbar .btn{font-size:11px;padding:8px 10px}
body.device-mobile #fullView{padding-top:126px}
.mobile-tree-shell{padding:14px 12px 40px;direction:rtl}
.mobile-tree-head{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:17px 15px;margin-bottom:12px}
.mobile-tree-head h1{margin:0 0 5px;font-size:22px;font-weight:900;color:#0f172a}
.mobile-tree-head p{margin:0;color:#64748b;font-size:12px;font-weight:700;line-height:1.8}
.mobile-node{margin-bottom:8px}
.mobile-node.depth-1,.mobile-node.depth-2,.mobile-node.depth-3,.mobile-node.depth-4{margin-right:16px;padding-right:12px;border-right:2px solid #e2e8f0}
.mobile-card{background:#fff;border:1px solid #e2e8f0;border-radius:15px;min-height:62px;padding:10px 11px;display:flex;align-items:center;gap:10px}
.mobile-card .status{width:8px;align-self:stretch;border-radius:999px;flex:0 0 8px}
.mobile-card .status.alive{background:#22c55e}.mobile-card .status.dead{background:#ef4444}
.mobile-card .avatar{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 40px;font-size:18px;font-weight:900}
.mobile-card .avatar.alive{background:#f0fdf4;color:#16a34a}.mobile-card .avatar.dead{background:#fef2f2;color:#dc2626}
.mobile-card .info{min-width:0;flex:1}.mobile-card .name{font-size:14px;font-weight:900;color:#1e293b;line-height:1.5;word-break:break-word}
.mobile-card .meta{margin-top:2px;color:#94a3b8;font-size:10px;font-weight:700;display:flex;flex-wrap:wrap;gap:7px}
.mobile-toggle{width:36px;height:36px;border:0;border-radius:11px;background:#f1f5f9;color:#334155;font-size:20px;font-weight:900;flex:0 0 36px}
.mobile-toggle.open{background:#e0e7ff;color:#3730a3}
.mobile-children{display:none;margin-top:7px}.mobile-children.open{display:block}
.mobile-legend{margin-top:14px;background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:11px 13px;display:flex;flex-wrap:wrap;gap:13px;color:#475569;font-size:11px;font-weight:800}
.mobile-legend span{display:flex;align-items:center;gap:5px}.mobile-legend i{width:9px;height:9px;border-radius:50%}
body.device-mobile #branchesView.active{margin-top:130px;width:100%;align-items:flex-start;overflow-x:auto;padding:0 10px 30px;-webkit-overflow-scrolling:touch}
body.device-mobile .branches-heading{min-width:100%}
@media print{.mobile-only{display:none!important}.desktop-full-tree{display:block!important}}

</style>
</head>
<body>
<div class="toolbar no-print">
  <div class="switch">
    <button class="btn btn-tab active" id="fullTab">الشجرة الكاملة</button>
    <button class="btn btn-tab" id="branchTab">عرض الفروع (A4)</button>
  </div>
  <div class="sep"></div>
  <button class="btn btn-dark" id="jpgBtn">صورة عالية الدقة (JPG)</button>
  <button class="btn btn-red" id="printPdfBtn">تصدير PDF (عبر الطباعة)</button>
  <div class="branch-actions" style="display:none">
    <button class="btn btn-dark" id="branchesPngBtn">تصدير الفروع (صور)</button>
    <button class="btn btn-indigo" id="branchesPdfBtn">تصدير الفروع (PDF)</button>
  </div>
  <div class="sep"></div>
  <div class="zoom-controls" id="zoomControls">
    <button class="zoom-btn" id="zoomOut" title="تصغير">−</button>
    <span class="zoom-label" id="zoomLabel">70%</span>
    <button class="zoom-btn" id="zoomIn" title="تكبير">+</button>
    <button class="btn btn-tab" id="zoomFit" style="padding:8px 11px">ملاءمة</button>
  </div>
  <button class="btn btn-blue" onclick="window.print()">طباعة</button>
</div>

<div id="fullView" class="view active">
  <div class="mobile-only mobile-tree-shell" id="mobileTreeShell">
    <div class="mobile-tree-head">
      <h1>شجرة عائلة آل حمود</h1>
      <p>عرض مخصص للجوال. اضغط + لفتح الأبناء و− لإغلاق الفرع.</p>
    </div>
    <div id="mobileTreeList"></div>
    <div class="mobile-legend">
      <span><i style="background:#22c55e"></i> حي</span>
      <span><i style="background:#ef4444"></i> متوفى</span>
      <span>♂ ذكر</span>
    </div>
  </div>
  <div class="full-wrap desktop-full-tree" id="fullWrap">
    <div class="canvas-stage" id="canvasStage">
    <div id="printContainer" class="print-container">
      
      <header class="hero">
        <h1>شجرة عائلة آل حمود</h1>
        <div class="hero-sub"><i class="dot-blue"></i><span>توثيق النسب والبيانات التاريخية المعتمدة</span><i class="dot-blue"></i></div>
      </header>
      <main class="tree-area" id="treeArea"></main>
      <footer class="footer">
        <div class="legend">
          <div class="legend-item"><i class="legend-dot alive"></i><span>حي</span></div>
          <div class="legend-item"><i class="legend-dot dead"></i><span>متوفى</span></div>
          <div class="legend-line"></div>
          <div class="legend-item"><span style="font-size:27px">♂</span><span>ذكر</span></div>
        </div>
        <div class="edit-box">
          <div>تحرير: <span id="today1"></span></div>
          
        </div>
      </footer>
    </div>
    </div>
  </div>
</div>

<div id="branchesView" class="branches-view"></div>

<div class="export-overlay" id="overlay">
  <div class="export-card">
    <div class="spinner" id="spinner"></div>
    <h2 id="overlayTitle">جاري المعالجة الاحترافية</h2>
    <div class="progress"><div id="progressBar"></div></div>
    <p id="overlayText">جاري تجهيز الملف...</p>
    <a id="downloadLink" class="download-link">تحميل الملف الآن</a>
    <button id="closeOverlay" class="btn btn-dark" style="display:none;margin:18px auto 0">إغلاق</button>
  </div>
</div>

<script>
const RAW_CSV_DATA = `الاسم,الفرع,الاسم الكامل,الجوال,ملاحظات,اللقب,تاريخ الميلاد,تاريخ الوفاة,الحالة,الجنس

const orderMap = {
  "حمود":["سلطان","مسلط","ذكار","حجاب","نايف","محمد"],
  "سلطان بن حمود":["نايف","حمود","محمد","غازي","محسن","صالح","ناصر","مسلط","سرحان","عبدالله","سيف","سعود","خالد","حجاب"],
  "مسلط بن حمود":["حمود","سلطان","محمد","فهد","فالح","نواف","راكان","مقرن","نايف","متعب"],
  "ذكار بن حمود":["حمود","سلطان","مسلط","ضيف الله","نايف","فالح","فراج","محمد","عبدالله","حجاب","صالح","فيصل","سعود","فهد"],
  "محمد بن حمود":["حمود","سلطان","ماجد","نايف"],
  "نايف بن حمود":["حجاب","عبدالله","خالد"]
};
const normalize = s => (s||"").trim().replace(/\s+/g," ");
const familyData = RAW_CSV_DATA.split("\n").slice(1).map(line=>{
  const v=line.split(",");
  return {name:normalize(v[0]),branch:normalize(v[1]),fullName:normalize(v[2]),mobile:normalize(v[3]),notes:normalize(v[4]),title:normalize(v[5]),birthDate:normalize(v[6]),deathDate:normalize(v[7]),status:normalize(v[8])==="حي"?"حي":"متوفى",gender:normalize(v[9])==="ذكر"?"ذكر":"أنثى"};
}).filter(m=>m.fullName);
const unique = [...new Map(familyData.map(m=>[m.fullName,m])).values()];
const byName = new Map(unique.map(m=>[m.fullName,m]));

function getChildren(fullName){
  const n=normalize(fullName);
  const arr=unique.filter(m=>{
    const parts=m.fullName.split(" بن ");
    if(parts.length<2) return false;
    return normalize(parts.slice(1).join(" بن "))===n;
  });
  const ord=orderMap[n];
  arr.sort((a,b)=>{
    if(ord){
      const ia=ord.indexOf(a.name), ib=ord.indexOf(b.name);
      if(ia!==-1 && ib!==-1) return ia-ib;
      if(ia!==-1) return -1;if(ib!==-1) return 1;
    }
    return a.name.localeCompare(b.name,"ar");
  });
  return arr;
}
function buildTree(fullName){
  const member=byName.get(normalize(fullName)) || {name:fullName.split(" بن ")[0],fullName,status:"حي",gender:"ذكر"};
  return {member,children:getChildren(fullName).map(c=>buildTree(c.fullName))};
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function memberCard(m){
  const alive=m.status==="حي";
  return `<div class="member-card">
    <div class="status-bar ${alive?"alive":"dead"}"></div>
    <div class="member-inner">
      <div class="person-icon ${alive?"alive-bg":"dead-bg"}">${alive?"✓":"✕"}</div>
      <div class="member-name">${esc(m.fullName)}</div>
      <div class="small-sep"><i></i><b></b><i></i></div>
      <div class="gender-pill"><span>♂</span><span>${esc(m.gender)}</span></div>
    </div>
  </div>`;
}
function nodeHtml(node){
  const has=node.children.length>0;
  const kids=node.children.map(c=>`<div class="child-col"><div class="down"></div>${nodeHtml(c)}</div>`).join("");
  return `<div class="tree-node">
    <div class="node-card-wrap ${has?"has-children":""}">${memberCard(node.member)}</div>
    ${has?`<div class="children-row ${node.children.length>1?"multi":""}" style="--count:${node.children.length}">${kids}</div>`:""}
  </div>`;
}
const root=buildTree("حمود");
document.getElementById("treeArea").innerHTML=nodeHtml(root);

function saDate(){return new Date().toLocaleDateString("ar-SA")}

const fathers = unique.filter(m=>{
  const f=normalize(m.fullName);
  if(f==="حمود") return true;
  const parts=f.split(" بن ");
  return parts.length===2 && parts[1]==="حمود";
}).sort((a,b)=>{
  if(a.fullName==="حمود") return -1;if(b.fullName==="حمود") return 1;
  const ord=orderMap["حمود"], ia=ord.indexOf(a.name), ib=ord.indexOf(b.name);
  return (ia<0?99:ia)-(ib<0?99:ib);
});

function branchPage(father){
  const kids=getChildren(father.fullName);
  const totalGc=kids.reduce((n,k)=>n+getChildren(k.fullName).length,0);
  const cols=kids.length>6?4:kids.length>3?3:2;
  const desc=kids.map(k=>{
    const gc=getChildren(k.fullName);
    return `<div class="desc-card">
      <div class="desc-title"><i class="${k.status==="حي"?"alive":"dead"}"></i><div><strong>${esc(k.name)}</strong>${k.title?`<small>${esc(k.title)}</small>`:""}</div></div>
      ${gc.length?`<div class="gc-grid" style="grid-template-columns:${gc.length>4?"1fr 1fr":"1fr"}">${gc.map(x=>`<div class="gc"><i class="${x.status==="حي"?"alive":"dead"}"></i><span>${esc(x.name)}</span></div>`).join("")}</div>`:`<div class="empty">لا يوجد أحفاد مسجلين</div>`}
    </div>`;
  }).join("");
  return `<section class="branch-page">
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    
    <div class="branch-head">
      <div class="gold-line"></div>
      <div class="eyebrow">سلسلة نسب آل حمود</div>
      <h3>فرع ${esc(father.name)}</h3>
      <div class="ancestor"><i></i><span>الجد الجامع للفرع: ${esc(father.fullName)}</span><i></i></div>
    </div>
    <div class="branch-content">
      <div class="father-info">
        <div class="father-card"><small>بيانات الأب</small><h4>${esc(father.fullName)}</h4><div class="state-row"><i class="${father.status==="حي"?"alive":"dead"}"></i><span>${esc(father.status)}</span></div></div>
        <div class="stats"><div class="stat"><strong>${kids.length}</strong><span>عدد الأبناء</span></div><div class="stat"><strong>${totalGc}</strong><span>إجمالي الأحفاد</span></div></div>
        <div class="stamp"><p>ختم التوثيق الرسمي</p><div class="stamp-circle"></div></div>
      </div>
      <div class="desc-grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${desc}</div>
    </div>
    <div class="branch-foot">
      <div><div class="doc">وثيقة نسب معتمدة - الإصدار الرابع (A4)</div></div>
      <div class="foot-meta"><div><small>تاريخ الإصدار</small><strong>${saDate()}</strong></div><div class="vline"></div><div><small>رقم الصفحة</small><strong>فرع ${esc(father.name)}</strong></div></div>
    </div>
  </section>`;
}

      progressBar.style.width=`${((i+1)/pages.length)*100}%`;
      const canvas=await html2canvas(pages[i],{backgroundColor:"#fdfcf8",scale:1,useCORS:true});
      const img=canvas.toDataURL("image/jpeg",.82);
      if(i>0) pdf.addPage("a4","landscape");
      pdf.addImage(img,"JPEG",0,0,pdf.internal.pageSize.getWidth(),pdf.internal.pageSize.getHeight(),undefined,"FAST");
      await new Promise(r=>setTimeout(r,200));
    }
    const blob=pdf.output("blob"), url=URL.createObjectURL(blob);
    finishOverlay(url,`Al_Hammoud_Branches_Doc_${Date.now()}.pdf`);
  }catch(e){console.error(e);failOverlay("حدث خطأ أثناء تصدير PDF للفروع.");}
};

let treeZoom=.70;
const stage=document.getElementById("canvasStage"), wrap=document.getElementById("fullWrap"), zoomLabel=document.getElementById("zoomLabel");
function applyZoom(){
  stage.style.transform=`scale(${treeZoom})`;
  const pc=document.getElementById("printContainer");
  stage.style.width=(pc.scrollWidth*treeZoom)+"px";
  stage.style.height=(pc.scrollHeight*treeZoom)+"px";
  stage.style.minWidth=(pc.scrollWidth*treeZoom)+"px";
  stage.style.minHeight=(pc.scrollHeight*treeZoom)+"px";
  zoomLabel.textContent=Math.round(treeZoom*100)+"%";
}
document.getElementById("zoomOut").onclick=()=>{treeZoom=Math.max(.25,treeZoom-.1);applyZoom()};
document.getElementById("zoomIn").onclick=()=>{treeZoom=Math.min(1.4,treeZoom+.1);applyZoom()};
document.getElementById("zoomFit").onclick=()=>{
  const pc=document.getElementById("printContainer");
  const available=Math.max(300,wrap.clientWidth-36);
  treeZoom=Math.max(.25,Math.min(1,available/pc.scrollWidth));
  applyZoom();
  wrap.scrollLeft=(wrap.scrollWidth-wrap.clientWidth)/2;
};
window.addEventListener("load",()=>setTimeout(()=>{
  applyZoom();
  document.getElementById("zoomFit").click();
},250));
window.addEventListener("resize",()=>applyZoom());


/* السحب بالماوس/اللمس لتحريك الشجرة في جميع الاتجاهات */
(() => {
  const panArea = document.getElementById("fullWrap");
  if (!panArea || panArea.dataset.panReady === "1") return;
  panArea.dataset.panReady = "1";

  let dragging = false;
  let startX = 0;
  let startY = 0;
  let startScrollLeft = 0;
  let startScrollTop = 0;
  let pointerId = null;

  panArea.addEventListener("pointerdown", (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    if (e.target.closest("button, a, input, select, textarea")) return;

    dragging = true;
    pointerId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    startScrollLeft = panArea.scrollLeft;
    startScrollTop = panArea.scrollTop;

    panArea.classList.add("is-panning");
    try { panArea.setPointerCapture(pointerId); } catch (_) {}
    e.preventDefault();
  });

  panArea.addEventListener("pointermove", (e) => {
    if (!dragging || e.pointerId !== pointerId) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    panArea.scrollLeft = startScrollLeft - dx;
    panArea.scrollTop = startScrollTop - dy;
    e.preventDefault();
  });

  const stopPan = (e) => {
    if (!dragging) return;
    if (e && pointerId !== null && e.pointerId !== pointerId) return;

    dragging = false;
    panArea.classList.remove("is-panning");

    if (pointerId !== null) {
      try { panArea.releasePointerCapture(pointerId); } catch (_) {}
    }
    pointerId = null;
  };

  panArea.addEventListener("pointerup", stopPan);
  panArea.addEventListener("pointercancel", stopPan);
  panArea.addEventListener("lostpointercapture", stopPan);

  // منع سحب العناصر الافتراضي داخل مساحة الشجرة.
  panArea.addEventListener("dragstart", (e) => e.preventDefault());
})();


function updateDeviceMode(){
  const narrow=window.matchMedia("(max-width: 768px)").matches;
  const coarse=window.matchMedia("(pointer: coarse)").matches;
  const mobileMode=narrow && coarse;
  document.body.classList.toggle("device-mobile",mobileMode);
  document.body.classList.toggle("device-desktop",!mobileMode);
}
updateDeviceMode();
window.addEventListener("resize",updateDeviceMode);
window.addEventListener("orientationchange",()=>setTimeout(updateDeviceMode,150));

function mobileNodeHtml(node,depth=0){
  const m=node.member, alive=m.status==="حي", has=node.children&&node.children.length>0, d=Math.min(depth,4);
  return `<div class="mobile-node depth-${d}">
    <div class="mobile-card">
      <div class="status ${alive?"alive":"dead"}"></div>
      <div class="avatar ${alive?"alive":"dead"}">${alive?"✓":"✕"}</div>
      <div class="info">
        <div class="name">${esc(m.fullName)}</div>
        <div class="meta"><span>${esc(m.status)}</span><span>${esc(m.gender)}</span>${m.title?`<span>${esc(m.title)}</span>`:""}</div>
      </div>
      ${has?`<button type="button" class="mobile-toggle ${depth===0?"open":""}">${depth===0?"−":"+"}</button>`:""}
    </div>
    ${has?`<div class="mobile-children ${depth===0?"open":""}">${node.children.map(c=>mobileNodeHtml(c,depth+1)).join("")}</div>`:""}
  </div>`;
}
const mobileTreeList=document.getElementById("mobileTreeList");
if(mobileTreeList){
  mobileTreeList.innerHTML=mobileNodeHtml(root,0);
  mobileTreeList.addEventListener("click",e=>{
    const btn=e.target.closest(".mobile-toggle"); if(!btn)return;
    const node=btn.closest(".mobile-node"); if(!node)return;
    const children=[...node.children].find(el=>el.classList&&el.classList.contains("mobile-children"));
    if(!children)return;
    const open=children.classList.toggle("open");
    btn.classList.toggle("open",open); btn.textContent=open?"−":"+";
  });
}
